<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta pendiente — FarmaControl</title>
<script>(function(){ var t = localStorage.getItem('farmacontrol-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); })();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body class="min-h-screen flex items-center justify-center antialiased grid-glow px-6">
  <div class="card p-10 max-w-md w-full text-center fade-in">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6" style="background:rgba(251,191,36,.12);">
      <span class="text-3xl">⏳</span>
    </div>
    <h1 class="font-display text-2xl font-bold mb-3" style="color:var(--text-1);">Tu cuenta está pendiente de aprobación</h1>
    <p class="text-sm mb-1" style="color:var(--text-2);">Hola <strong id="nombre-usuario" style="color:var(--text-1);"></strong>, tu registro fue exitoso.</p>
    <p class="text-sm mb-8" style="color:var(--text-2);">Un administrador debe asignarte permisos (Cajero o Administrador) antes de que puedas entrar al sistema. Esto puede tardar un poco — inténtalo de nuevo más tarde.</p>
    <div class="flex flex-col gap-3">
      <button onclick="verificarDeNuevo()" id="btn-verificar" class="btn-primary py-3 text-white font-bold rounded-xl transition text-sm">Ya tengo permisos, verificar de nuevo</button>
      <button onclick="cerrarSesion()" class="py-3 font-semibold rounded-xl transition glass text-sm" style="color:var(--text-2);">Cerrar sesión</button>
    </div>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script>
    let perfilActual = null;

    async function cargar() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
      perfilActual = perfil;
      document.getElementById('nombre-usuario').textContent = perfil ? perfil.nombre : '';
      if (perfil && perfil.rol !== 'sin_permisos') {
        window.location.href = 'redirigiendo.html';
      }
    }

    async function verificarDeNuevo() {
      const btn = document.getElementById('btn-verificar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verificando...';
      await cargar();
      btn.disabled = false;
      btn.innerHTML = 'Ya tengo permisos, verificar de nuevo';
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    cargar();
  </script>
</body>
</html>
